services:
  - type: web
    name: drshoezclean
    runtime: docker
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build-css
    startCommand: |
      php -S 0.0.0.0:$PORT -t .
    envVars:
      - key: APP_ENV
        value: production
